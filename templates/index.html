<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Nebula 1</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --chat-bg: #141414;
      --input-bg: #1f1f1f;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --user: #7c9cff;
      --ai: #5eead4;
      --blue: #3b82f6;
      --green: #34d399;
      --amber: #fbbf24;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    #status {
      font-size: 0.8rem;
      color: var(--green);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
      background: var(--chat-bg);
    }

    .msg {
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    .msg .role {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .msg.user .role { color: var(--user); }
    .msg.ai .role   { color: var(--ai); }
    .msg.system .role { color: var(--green); font-style: italic; }

    .msg .body {
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.ai .body { color: #c5c5c5; }

    .msg .sep {
      margin-top: 12px;
      border: none;
      border-top: 1px solid var(--border);
    }

    #input-bar {
      background: var(--bg);
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
    }

    #message {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      padding: 8px 6px;
      resize: none;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: #fff;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .btn:active { transform: scale(0.97); }

    #send-btn { background: var(--blue); }
    #send-btn:hover { background: #2563eb; }

    #reset-btn { background: #3f3f46; }
    #reset-btn:hover { background: #52525b; }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.35rem;
      padding: 6px 8px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--text); }

    #file-input { display: none; }

    .preview {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-radius: 8px;
      padding: 8px;
    }
    .preview img {
      max-height: 64px;
      border-radius: 6px;
    }
    .preview .meta {
      font-size: 0.8rem;
      color: var(--muted);
      flex: 1;
    }
    .preview .remove {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing span {
      width: 6px;
      height: 6px;
      background: var(--ai);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @supports (padding: max(0px)) {
      #input-bar {
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      Nebula 1
      <span class="badge">web</span>
    </div>
    <div id="status">Ready</div>
  </header>

  <div id="chat">
    <div class="msg system">
      <div class="role">System</div>
      <div class="body">System ready · Nebula 1</div>
    </div>
  </div>

  <div id="input-bar">
    <div class="preview" id="preview">
      <img id="preview-img" alt="preview" />
      <div class="meta" id="preview-meta"></div>
      <button class="remove" id="remove-preview" title="Remove">×</button>
    </div>

    <div class="input-row">
      <button class="icon-btn" id="cam-btn" title="Photo">📷</button>
      <input type="file" id="file-input" accept="image/*" capture="environment" />

      <textarea id="message" rows="1" placeholder="Message Nebula 1..." enterkeyhint="send"></textarea>

      <button class="btn" id="reset-btn" title="Reset chat">Reset</button>
      <button class="btn" id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const msgInput = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file-input");
    const camBtn = document.getElementById("cam-btn");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("preview-img");
    const previewMeta = document.getElementById("preview-meta");
    const removePreview = document.getElementById("remove-preview");

    let selectedFile = null;

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || "var(--green)";
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const roleLabel = role === "user" ? "You" : role === "ai" ? "Nebula 1" : "System";
      div.innerHTML = `
        <div class="role">${roleLabel}</div>
        <div class="body"></div>
        ${role === "ai" ? '<hr class="sep" />' : ""}
      `;
      div.querySelector(".body").textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "msg ai";
      div.id = "typing";
      div.innerHTML = `
        <div class="role">Nebula 1</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    async function sendText() {
      const text = msgInput.value.trim();
      if (!text && !selectedFile) return;

      if (selectedFile) {
        await sendImage(text);
        return;
      }

      addMessage("user", text);
      msgInput.value = "";
      autoResize();
      setStatus("Thinking...", "var(--amber)");
      showTyping();
      sendBtn.disabled = true;

      try {
        const form = new FormData();
        form.append("message", text);
        const res = await fetch("/chat", { method: "POST", body: form });
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMessage("system", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
        }
      } catch (err) {
        hideTyping();
        addMessage("system", "Network error: " + err.message);
      }

      setStatus("Ready", "var(--green)");
      sendBtn.disabled = false;
      msgInput.focus();
    }

    async function sendImage(caption) {
      if (!selectedFile) return;

      const label = caption
        ? `[Image] ${selectedFile.name}\n${caption}`
        : `[Image] ${selectedFile.name}`;
      addMessage("user", label);

      const form = new FormData();
      form.append("file", selectedFile);
      if (caption) form.append("caption", caption);

      clearPreview();
      msgInput.value = "";
      autoResize();
      setStatus("Uploading...", "var(--amber)");
      showTyping();
      sendBtn.disabled = true;

      try {
        const res = await fetch("/upload", { method: "POST", body: form });
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMessage("system", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
        }
      } catch (err) {
        hideTyping();
        addMessage("system", "Network error: " + err.message);
      }

      setStatus("Ready", "var(--green)");
      sendBtn.disabled = false;
      msgInput.focus();
    }

    async function resetChat() {
      try {
        await fetch("/reset", { method: "POST" });
        chatEl.innerHTML = "";
        addMessage("system", "System ready · Nebula 1");
        setStatus("Ready", "var(--green)");
      } catch (err) {
        addMessage("system", "Reset failed: " + err.message);
      }
    }

    function autoResize() {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
    }

    function clearPreview() {
      selectedFile = null;
      fileInput.value = "";
      preview.style.display = "none";
      previewImg.src = "";
    }

    sendBtn.addEventListener("click", sendText);
    resetBtn.addEventListener("click", resetChat);

    msgInput.addEventListener("input", autoResize);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    });

    camBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      previewMeta.textContent = file.name + " · " + Math.round(file.size / 1024) + " KB";
      preview.style.display = "flex";
    });

    removePreview.addEventListener("click", clearPreview);

    msgInput.focus();
  </script>
</body>
</html>
