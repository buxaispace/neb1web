<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Nebula 1</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --chat-bg: #141414;
      --input-bg: #1f1f1f;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --user: #7c9cff;
      --ai: #5eead4;
      --blue: #3b82f6;
      --green: #34d399;
      --amber: #fbbf24;
      --danger: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ---------- Auth screen ---------- */
    #auth-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
    }

    .auth-card h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .auth-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .auth-card label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .auth-card input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      padding: 12px 14px;
      margin-bottom: 14px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: var(--blue);
    }

    .auth-card .btn-primary {
      width: 100%;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .auth-card .btn-primary:hover { background: #2563eb; }

    .auth-toggle {
      text-align: center;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .auth-toggle a {
      color: var(--blue);
      cursor: pointer;
      text-decoration: none;
    }

    .auth-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }

    /* ---------- Chat UI ---------- */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .title {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #status {
      font-size: 0.8rem;
      color: var(--green);
    }

    #user-email {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    #logout-btn:hover { color: var(--text); border-color: var(--muted); }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
      background: var(--chat-bg);
    }

    .msg {
      margin-bottom: 18px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    .msg .role {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .msg.user .role { color: var(--user); }
    .msg.ai .role   { color: var(--ai); }
    .msg.system .role { color: var(--green); font-style: italic; }

    .msg .body {
      color: var(--text);
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.ai .body { color: #c5c5c5; }

    .msg .sep {
      margin-top: 12px;
      border: none;
      border-top: 1px solid var(--border);
    }

    #input-bar {
      background: var(--bg);
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
    }

    #message {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      padding: 8px 6px;
      resize: none;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: #fff;
      flex-shrink: 0;
    }

    .btn:active { transform: scale(0.97); }

    #send-btn { background: var(--blue); }
    #send-btn:hover { background: #2563eb; }

    #reset-btn { background: #3f3f46; }
    #reset-btn:hover { background: #52525b; }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.35rem;
      padding: 6px 8px;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--text); }

    #file-input { display: none; }

    .preview {
      margin-bottom: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border-radius: 8px;
      padding: 8px;
    }
    .preview img {
      max-height: 64px;
      border-radius: 6px;
    }
    .preview .meta {
      font-size: 0.8rem;
      color: var(--muted);
      flex: 1;
    }
    .preview .remove {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing span {
      width: 6px;
      height: 6px;
      background: var(--ai);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    @supports (padding: max(0px)) {
      #input-bar {
        padding-bottom: max(14px, env(safe-area-inset-bottom));
      }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ========== AUTH ========== -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1>Nebula 1</h1>
      <p class="sub" id="auth-sub">Sign in to continue</p>
      <div class="auth-error" id="auth-error"></div>

      <form id="auth-form">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" required autocomplete="email" />

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" />

        <button type="submit" class="btn-primary" id="auth-submit">Sign in</button>
      </form>

      <div class="auth-toggle">
        <span id="toggle-text">No account?</span>
        <a id="toggle-link">Create one</a>
      </div>
    </div>
  </div>

  <!-- ========== CHAT ========== -->
  <div id="chat-screen">
    <header>
      <div class="title">
        Nebula 1
        <span class="badge">web</span>
      </div>
      <div class="header-right">
        <span id="status">Ready</span>
        <span id="user-email"></span>
        <button id="logout-btn">Log out</button>
      </div>
    </header>

    <div id="chat"></div>

    <div id="input-bar">
      <div class="preview" id="preview">
        <img id="preview-img" alt="preview" />
        <div class="meta" id="preview-meta"></div>
        <button class="remove" id="remove-preview" title="Remove">×</button>
      </div>

      <div class="input-row">
        <button class="icon-btn" id="cam-btn" title="Photo">📷</button>
        <input type="file" id="file-input" accept="image/*" capture="environment" />

        <textarea id="message" rows="1" placeholder="Message Nebula 1..." enterkeyhint="send"></textarea>

        <button class="btn" id="reset-btn" title="Reset chat">Reset</button>
        <button class="btn" id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const authScreen = document.getElementById("auth-screen");
    const chatScreen = document.getElementById("chat-screen");
    const authForm = document.getElementById("auth-form");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const authSubmit = document.getElementById("auth-submit");
    const authError = document.getElementById("auth-error");
    const authSub = document.getElementById("auth-sub");
    const toggleText = document.getElementById("toggle-text");
    const toggleLink = document.getElementById("toggle-link");
    const logoutBtn = document.getElementById("logout-btn");
    const userEmailEl = document.getElementById("user-email");

    const chatEl = document.getElementById("chat");
    const msgInput = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file-input");
    const camBtn = document.getElementById("cam-btn");
    const preview = document.getElementById("preview");
    const previewImg = document.getElementById("preview-img");
    const previewMeta = document.getElementById("preview-meta");
    const removePreview = document.getElementById("remove-preview");

    let isRegister = false;
    let selectedFile = null;

    function getToken() {
      return localStorage.getItem("nebula_token");
    }

    function setToken(token) {
      localStorage.setItem("nebula_token", token);
    }

    function clearToken() {
      localStorage.removeItem("nebula_token");
      localStorage.removeItem("nebula_email");
    }

    function authHeaders() {
      const t = getToken();
      return t ? { Authorization: "Bearer " + t } : {};
    }

    function showError(msg) {
      authError.textContent = msg;
      authError.style.display = "block";
    }

    function hideError() {
      authError.style.display = "none";
    }

    function showAuth() {
      authScreen.style.display = "flex";
      chatScreen.style.display = "none";
    }

    function showChat(email) {
      authScreen.style.display = "none";
      chatScreen.style.display = "flex";
      userEmailEl.textContent = email || localStorage.getItem("nebula_email") || "";
    }

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || "var(--green)";
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      const roleLabel = role === "user" ? "You" : role === "ai" ? "Nebula 1" : "System";
      div.innerHTML = `
        <div class="role">${roleLabel}</div>
        <div class="body"></div>
        ${role === "ai" ? '<hr class="sep" />' : ""}
      `;
      div.querySelector(".body").textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "msg ai";
      div.id = "typing";
      div.innerHTML = `
        <div class="role">Nebula 1</div>
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function hideTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    function autoResize() {
      msgInput.style.height = "auto";
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + "px";
    }

    function clearPreview() {
      selectedFile = null;
      fileInput.value = "";
      preview.style.display = "none";
      previewImg.src = "";
    }

    // Toggle login / register
    toggleLink.addEventListener("click", () => {
      isRegister = !isRegister;
      hideError();
      if (isRegister) {
        authSub.textContent = "Create your account";
        authSubmit.textContent = "Create account";
        toggleText.textContent = "Already have an account?";
        toggleLink.textContent = "Sign in";
        authPassword.autocomplete = "new-password";
      } else {
        authSub.textContent = "Sign in to continue";
        authSubmit.textContent = "Sign in";
        toggleText.textContent = "No account?";
        toggleLink.textContent = "Create one";
        authPassword.autocomplete = "current-password";
      }
    });

    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();
      const email = authEmail.value.trim();
      const password = authPassword.value;
      const endpoint = isRegister ? "/register" : "/login";

      authSubmit.disabled = true;
      try {
        const form = new FormData();
        form.append("email", email);
        form.append("password", password);
        const res = await fetch(endpoint, { method: "POST", body: form });
        const data = await res.json();
        if (data.error) {
          showError(data.error);
          return;
        }
        setToken(data.token);
        localStorage.setItem("nebula_email", data.email);
        showChat(data.email);
        await loadHistory();
      } catch (err) {
        showError("Network error: " + err.message);
      } finally {
        authSubmit.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", () => {
      clearToken();
      chatEl.innerHTML = "";
      showAuth();
    });

    async function loadHistory() {
      chatEl.innerHTML = "";
      try {
        const res = await fetch("/history", { headers: authHeaders() });
        if (res.status === 401) {
          clearToken();
          showAuth();
          return;
        }
        const data = await res.json();
        if (!data.messages || data.messages.length === 0) {
          addMessage("system", "System ready · Nebula 1");
          return;
        }
        for (const m of data.messages) {
          addMessage(m.role === "assistant" ? "ai" : "user", m.content);
        }
      } catch {
        addMessage("system", "System ready · Nebula 1");
      }
    }

    async function sendText() {
      const text = msgInput.value.trim();
      if (!text && !selectedFile) return;

      if (selectedFile) {
        await sendImage(text);
        return;
      }

      addMessage("user", text);
      msgInput.value = "";
      autoResize();
      setStatus("Thinking...", "var(--amber)");
      showTyping();
      sendBtn.disabled = true;

      try {
        const form = new FormData();
        form.append("message", text);
        const res = await fetch("/chat", {
          method: "POST",
          headers: authHeaders(),
          body: form,
        });
        if (res.status === 401) {
          clearToken();
          showAuth();
          return;
        }
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMessage("system", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
        }
      } catch (err) {
        hideTyping();
        addMessage("system", "Network error: " + err.message);
      }

      setStatus("Ready", "var(--green)");
      sendBtn.disabled = false;
      msgInput.focus();
    }

    async function sendImage(caption) {
      if (!selectedFile) return;

      const label = caption
        ? `[Image] ${selectedFile.name}\n${caption}`
        : `[Image] ${selectedFile.name}`;
      addMessage("user", label);

      const form = new FormData();
      form.append("file", selectedFile);
      if (caption) form.append("caption", caption);

      clearPreview();
      msgInput.value = "";
      autoResize();
      setStatus("Uploading...", "var(--amber)");
      showTyping();
      sendBtn.disabled = true;

      try {
        const res = await fetch("/upload", {
          method: "POST",
          headers: authHeaders(),
          body: form,
        });
        if (res.status === 401) {
          clearToken();
          showAuth();
          return;
        }
        const data = await res.json();
        hideTyping();
        if (data.error) {
          addMessage("system", "Error: " + data.error);
        } else {
          addMessage("ai", data.reply);
        }
      } catch (err) {
        hideTyping();
        addMessage("system", "Network error: " + err.message);
      }

      setStatus("Ready", "var(--green)");
      sendBtn.disabled = false;
      msgInput.focus();
    }

    async function resetChat() {
      try {
        const res = await fetch("/reset", {
          method: "POST",
          headers: authHeaders(),
        });
        if (res.status === 401) {
          clearToken();
          showAuth();
          return;
        }
        chatEl.innerHTML = "";
        addMessage("system", "System ready · Nebula 1");
        setStatus("Ready", "var(--green)");
      } catch (err) {
        addMessage("system", "Reset failed: " + err.message);
      }
    }

    sendBtn.addEventListener("click", sendText);
    resetBtn.addEventListener("click", resetChat);
    msgInput.addEventListener("input", autoResize);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendText();
      }
    });

    camBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      previewMeta.textContent = file.name + " · " + Math.round(file.size / 1024) + " KB";
      preview.style.display = "flex";
    });
    removePreview.addEventListener("click", clearPreview);

    // Boot
    (async function init() {
      if (getToken()) {
        try {
          const res = await fetch("/me", { headers: authHeaders() });
          if (res.ok) {
            const data = await res.json();
            localStorage.setItem("nebula_email", data.email);
            showChat(data.email);
            await loadHistory();
            return;
          }
        } catch {}
        clearToken();
      }
      showAuth();
    })();
  </script>
</body>
</html>
